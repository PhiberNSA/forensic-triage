[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-triage"
version = "0.1.0"
description = "Zero-dependency digital forensics triage toolkit: hashing, file-type and entropy analysis, structure-aware file carving, IOC extraction and MACB timelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PhiberNSA" }]
keywords = ["forensics", "dfir", "digital-forensics", "file-carving", "triage", "ioc", "cybersecurity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Recovery Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/PhiberNSA/forensic-triage"
Issues = "https://github.com/PhiberNSA/forensic-triage/issues"

[project.scripts]
ftriage = "ftriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
